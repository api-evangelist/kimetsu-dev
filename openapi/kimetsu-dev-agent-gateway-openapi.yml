  /a2a/sidequest:
    post:
      summary: Request Sidequest guidance
      description: 'Returns deterministic text guidance using A2A JSON-RPC. It does not perform actions, accept
        credentials, or write to GitHub. Use message/send for A2A 0.3 or SendMessage with A2A-Version: 1.0 for A2A
        1.0. The request body limit is 16,384 bytes.'
      operationId: request_sidequest_guidance
      tags:
      - A2A
      security: []
      parameters:
      - name: A2A-Version
        in: header
        required: false
        description: Defaults to 0.3 when omitted.
        schema:
          type: string
          enum:
          - '0.3'
          - '1.0'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        '200':
          description: A JSON-RPC result or protocol-level error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
        '204':
          description: A notification was accepted without a body.
        '400':
          description: Credential headers or query strings were rejected.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '413':
          description: The request body exceeded 16,384 bytes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '415':
          description: Content-Type was not application/json.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  schemas:
    JsonRpcRequest:
      type: object
      required:
      - jsonrpc
      - method
      properties:
        jsonrpc:
          const: '2.0'
        id:
          type:
          - string
          - number
          - 'null'
        method:
          type: string
          enum:
          - message/send
          - SendMessage
        params:
          type: object
          additionalProperties: true
      additionalProperties: true
    JsonRpcResponse:
      type: object
      required:
      - jsonrpc
      properties:
        jsonrpc:
          const: '2.0'
        id:
          type:
          - string
          - number
          - 'null'
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
      additionalProperties: true

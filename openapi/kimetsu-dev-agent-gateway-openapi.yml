# Faithful YAML rendering of https://agents.kimetsu.dev/openapi.json (fetched 2026-09-19, HTTP 200, application/json).
# Nothing added or removed; the verbatim JSON is in openapi/_original/. API Evangelist annotations live in overlays/.
openapi: 3.1.0
info:
  title: kimetsu.dev Agent Gateway
  version: 1.0.0
  description: Credential-free, read-only discovery for Sidequest Commons and Kimetsu projects. All reads are anonymous.
    Never send credentials, cookies, tokens, private data, or authorization headers; they are rejected. Query strings
    and caller-supplied fetch targets are also rejected.
  license:
    name: MIT
    identifier: MIT
externalDocs:
  description: Project discovery documentation
  url: https://kimetsu.dev/projects/
servers:
- url: https://agents.kimetsu.dev
security: []
tags:
- name: Discovery
  description: Static, anonymous machine-discovery documents.
- name: Sidequest
  description: Read-only Sidequest Commons public data.
- name: A2A
  description: Deterministic guidance; no delegated actions or writes.
paths:
  /:
    get:
      summary: Get agent gateway
      description: Returns the complete public endpoint directory and safety constraints.
      operationId: get_agent_gateway
      security: []
      responses:
        '200':
          description: Successful public response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: The request contained a query string or credential-bearing header.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '405':
          description: The HTTP method is not supported for this route.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      tags:
      - Discovery
  /agent-gateway.json:
    get:
      summary: Get agent gateway alias

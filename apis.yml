aid: kimetsu-dev
name: Kimetsu
description: 'Kimetsu (kimetsu.dev) is Rodrigo Córdoba''s open-source infrastructure for coding agents. Kimetsu itself
  is a local, model-free memory sidecar — one Rust binary and one SQLite brain per project — that Claude Code, Codex,
  Cursor, Pi and OpenClaw load as a local-stdio MCP server (~28 kimetsu_* tools), with a CLI, npm/cargo/PyPI packages,
  a self-hostable Kimetsu Remote HTTP MCP server and published benchmark numbers. The domain also operates agents.kimetsu.dev,
  a credential-free, read-only Agent Gateway with a published OpenAPI 3.1.0 (15 operations), an A2A Agent Card served
  at the RFC 8615 path (0.3 by default, 1.0 negotiated with the A2A-Version header) and a live JSON-RPC guide for
  Sidequest Commons — the maintainer''s daily public project-selection loop run through GitHub issues and reactions
  — plus llms.txt on two hosts, a /.well-known/kimetsu-agents.json discovery pointer and JSON Schemas for its discovery
  documents. Everything is MIT OR Apache-2.0. Seeded from the A2A Registry listing dev.kimetsu.sidequest_commons_guide
  under the harvest name "Sidequest Commons".'
image: https://kimetsu.dev/kimetsu-logo.png
url: https://raw.githubusercontent.com/api-evangelist/kimetsu-dev/refs/heads/main/apis.yml

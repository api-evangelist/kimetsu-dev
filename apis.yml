- aid: kimetsu-dev:kimetsu-mcp-server
  name: Kimetsu MCP Server (local stdio)
  description: 'The memory product''s agent surface: `kimetsu mcp serve` exposes ~28 kimetsu_* tools (context retrieval,
    lesson recording, memory CRUD and curation, citations, conflict resolution, embedding-model management, repo ingest,
    skill bridge) over stdio to Claude Code, Codex, Cursor, Pi, OpenClaw and Gemini CLI, backed by a per-project SQLite
    brain with no cloud and no telemetry. No provider-hosted endpoint; Kimetsu Remote (beta) lets an operator self-host
    the same surface over HTTP MCP with bearer tokens. Distributed as npm kimetsu-ai, crates.io kimetsu-cli and GitHub
    Release archives (v2.8.0, 2026-09-09).'
  humanURL: https://kimetsu.dev/docs/how-kimetsu-works/interfaces/

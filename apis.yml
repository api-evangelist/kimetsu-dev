- aid: kimetsu-dev:sidequest-commons-guide
  name: Sidequest Commons Guide (A2A)
  description: 'A2A agent (JSON-RPC; 0.3 message/send by default, 1.0 SendMessage with A2A-Version 1.0) that returns
    deterministic, credential-free guidance on discovering Sidequest Commons and on proposing, voting and contributing
    through GitHub. Two skills: discover_sidequests, explain_participation. No streaming, push notifications or tasks;
    performs no writes and rejects credentials. Listed in the A2A Registry as dev.kimetsu.sidequest_commons_guide.'
  humanURL: https://rodcor.github.io/sidequest-commons/agents/

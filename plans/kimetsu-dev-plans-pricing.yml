description: 'No paid plans exist. Kimetsu is open source (MIT OR Apache-2.0) and runs on the user''s machine; the
  Agent Gateway and A2A guide are anonymous and free ("No Commons login. No token handoff. No paywall."). The word
  "tier" in the docs is a product configuration, not a price: tier = "free" runs the model-free memory pipeline
  with zero API calls, tier = "deep" lets Kimetsu call a cheap model the user pays their own provider for (the
  docs headline "$0 API cost to store and recall"). Kimetsu Remote is self-hosted, so its cost is the operator''s
  infrastructure. No enterprise or contact-sales offer is published; /pricing 404s.'

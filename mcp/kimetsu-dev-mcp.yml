description: 'Kimetsu ships its MCP server inside the kimetsu binary: `kimetsu mcp serve` is a local stdio server
  that hosts (Claude Code, Codex, Cursor, Pi, OpenClaw, Gemini CLI) launch per project, exposing ~28 kimetsu_* tools
  over a per-project SQLite brain. `kimetsu setup --host <agent>` / `kimetsu plugin install <host>` write the host-native
  MCP config (.mcp.json + .claude/settings.json for Claude Code, .codex/ for Codex, openclaw.json, a Pi extension)
  plus the hook wiring. There is NO provider-hosted endpoint: the only HTTP MCP surface is Kimetsu Remote (beta),
  a separate `kimetsu-remote` server binary an operator runs on their own machine (bearer tokens, one brain per repo
  at https://<your-server>/mcp/<repo-id>). The tool list below is transcribed from the Interfaces page; inputSchema
  per tool requires a local `kimetsu mcp serve` + tools/list, which this pass did not run.'
deployment:
  mode: local-stdio
  endpoint: null
  install: npm install -g kimetsu-ai && kimetsu setup --host claude-code
  command: kimetsu mcp serve
  package: https://www.npmjs.com/package/kimetsu-ai
  alt_packages:
  - cargo install kimetsu-cli
  - https://github.com/RodCor/kimetsu/releases (prebuilt lean/embeddings archives for Linux, macOS, Windows)
  auth: none
  verified: searched
  transport: stdio
  hosts_supported:
  - claude-code
  - codex
  - cursor
  - pi
  - openclaw
  - gemini-cli
  self_hosted_remote:
    product: Kimetsu Remote (beta)
    package: https://www.npmjs.com/package/kimetsu-remote
    install: npm install -g kimetsu-remote
    serve: kimetsu-remote serve --addr 0.0.0.0:8787 --data /srv/kimetsu-brains --token <secret> --rate-limit 120
    endpoint_template: https://<your-server>:8787/mcp/<repo-id>
    client_wiring: kimetsu plugin install claude-code --remote https://kimetsu.example.com:8787
    auth: bearer token per teammate (KIMETSU_REMOTE_TOKEN), plain HTTP unless --features tls or a TLS proxy
    unauthenticated_routes:
    - GET /healthz
    - GET /metrics (Prometheus text, aggregate-only)
    rate_limit_default: 120 req/min per token (0 = off); 429 when exceeded
    note: Operator-run, not provider-hosted; recorded here so the remote mode is not mistaken for a public endpoint.
      The docs mark it beta with possible breaking changes before stable.
  registry:
    official_mcp_registry: not listed (registry.modelcontextprotocol.io/v0/servers?search=kimetsu returned 0 on
      2026-09-19)
  note: 'The A2A endpoint https://agents.kimetsu.dev/a2a/sidequest is NOT an MCP server: POST tools/list there returned
    JSON-RPC -32601 Method not found (probed 2026-09-19).'
server:
  name: kimetsu
  transport: stdio
  version: 2.8.0
  version_source: npm kimetsu-ai / crates.io kimetsu-cli, published 2026-09-09
  repository: https://github.com/RodCor/kimetsu
  license: MIT OR Apache-2.0
  response_envelope: 'Every tool returns {"ok": true, "usage": {...}} so the host gets usage guidance with the data.'
